<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake.io - Combat Evolved</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="game-container">
        <!-- Lobby -->
        <div id="lobby">
            <div class="lobby-content">
                <h1 class="logo">SNAKE.IO</h1>
                <p class="subtitle">COMBAT EVOLVED</p>
                
                <div class="stats">
                    <span class="label">BEST RECORD</span>
                    <span id="best-score">0</span>
                </div>

                <div class="mode-select">
                    <button id="btn-mode-solo" class="mode-btn">
                        <span class="title">SOLO CHALLENGE</span>
                        <span class="desc">90s 限時挑戰</span>
                    </button>
                    <button id="btn-mode-duel" class="mode-btn special">
                        <span class="title">1V1 DUEL (AI)</span>
                        <span class="desc">截斷對抗生死鬥</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- HUD Top -->
        <div id="hud-top" class="hidden">
            <div class="hud-item">
                <span class="label">LENGTH</span>
                <span id="current-length">0</span>
            </div>
            <div id="leaderboard">
                <!-- List items will be injected here -->
            </div>
            <div class="hud-item">
                <span class="label">TIME</span>
                <span id="timer">01:30</span>
            </div>
        </div>

        <!-- Canvas -->
        <canvas id="game-canvas"></canvas>

        <!-- HUD Bottom -->
        <div id="hud-bottom" class="hidden">
            <div id="energy-container">
                <div class="segments">
                    <div class="seg"></div><div class="seg"></div><div class="seg"></div><div class="seg"></div><div class="seg"></div>
                </div>
                <div id="energy-fill"></div>
            </div>
            <div id="joystick-zone">
                <div id="joystick-base">
                    <div id="joystick-handle"></div>
                </div>
            </div>
        </div>

        <!-- Game Over -->
        <div id="game-over" class="hidden">
            <div class="content">
                <h1>GAME OVER</h1>
                <p>FINAL LENGTH: <span id="final-score">0</span></p>
                <div class="game-over-btns">
                    <button id="btn-restart">RETRY</button>
                    <button id="btn-exit">EXIT</button>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="src/main.js"></script>
</body>
</html>
