<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Snake.io - Combat Evolved</title>
    <link rel="stylesheet" href="style.css?v=58">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
    <div id="game-container">
        <!-- Lobby -->
        <div id="lobby">
            <div class="lobby-content">
                <h1 class="logo">SNAKE.IO</h1>
                <p class="subtitle">COMBAT EVOLVED</p>

                <div class="stats">
                    <span class="label">BEST RECORD</span>
                    <span id="best-score">0</span>
                </div>

                <div class="mode-selection">
                    <div id="btn-mode-solo" class="mode-card">
                        <div class="title">SOLO CHALLENGE</div>
                        <div class="desc">150s 限時挑戰</div>
                    </div>
                    <div id="btn-mode-duel" class="mode-card special">
                        <div class="title">1V1 DUEL (AI)</div>
                        <div class="desc">截斷對抗生死鬥</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- HUD Top -->
        <div id="hud-top" class="hidden">
            <div class="hud-group-left">
                <div class="hud-item">
                    <span class="label">LENGTH</span>
                    <span id="current-length">0</span>
                </div>
                <div class="hud-item">
                    <span class="label">BEST</span>
                    <span id="total-score">0</span>
                </div>
            </div>

            <div class="hud-group-center">
                <span id="timer">02:30</span>
            </div>

            <div class="hud-group-right">
                <div id="leaderboard">
                    <!-- List items injected here -->
                </div>
            </div>
        </div>

        <!-- Canvas -->
        <canvas id="game-canvas"></canvas>

        <!-- HUD Bottom -->
        <div id="hud-bottom" class="hidden">
            <div id="respawn-overlay" class="hidden">
                <div class="respawn-timer">REVIVING IN <span id="respawn-sec">3</span>...</div>
            </div>
        </div>

        <!-- Floating Joystick Zone -->
        <div id="joystick-zone" class="hidden">
            <div id="joystick-base">
                <div id="joystick-handle"></div>
            </div>
            <!-- 加速按鈕 -->
            <button id="dash-btn" class="hidden">
                <div class="dash-icon">🚀</div>
            </button>
            <!-- 磁鐵技能按鈕 -->
            <button id="magnet-btn" class="hidden">
                <div class="skill-icon">🧲</div>
                <div id="magnet-cooldown-overlay"></div>
                <div id="magnet-cd-text"></div>
            </button>
            <!-- 鷹眼技能按鈕 -->
            <button id="eagleeye-btn" class="hidden">
                <div class="skill-icon">🦅</div>
                <div id="eagleeye-cooldown-overlay"></div>
                <div id="eagleeye-cd-text"></div>
            </button>
            <!-- 噴墨技能按鈕 -->
            <button id="ink-btn" class="hidden">
                <div class="skill-icon">🦑</div>
                <div id="ink-cooldown-overlay"></div>
                <div id="ink-cd-text"></div>
            </button>
        </div>

        <!-- Game Over / Settlement -->
        <div id="game-over" class="hidden">
            <div class="content">
                <h1 id="game-over-title">DEFEAT</h1>

                <div class="comparison-grid">
                    <div class="grid-header">STAT</div>
                    <div class="grid-header">YOU</div>
                    <div class="grid-header">BOT</div>
                    <div id="settlement-stats" class="grid-body">
                        <!-- Stats injected here -->
                    </div>
                </div>

                <div class="game-over-btns">
                    <button id="btn-restart">RETRY</button>
                    <button id="btn-exit">EXIT</button>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="src/main.js"></script>
</body>

</html>
