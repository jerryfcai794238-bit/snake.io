<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake.io - Combat Evolved</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="game-container">
        <!-- Lobby -->
        <div id="lobby">
            <div class="lobby-content">
                <h1 class="logo">SNAKE.IO</h1>
                <p class="subtitle">COMBAT EVOLVED</p>
                
                <div class="stats">
                    <span class="label">BEST RECORD</span>
                    <span id="best-score">0</span>
                </div>

                <div class="mode-select">
                    <button id="btn-mode-solo" class="mode-btn">
                        <span class="title">SOLO CHALLENGE</span>
                        <span class="desc">90s 限時挑戰</span>
                    </button>
                    <button id="btn-mode-duel" class="mode-btn special">
                        <span class="title">1V1 DUEL (AI)</span>
                        <span class="desc">截斷對抗生死鬥</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- HUD Top -->
        <div id="hud-top" class="hidden">
            <div class="hud-item">
                <span class="label">LENGTH</span>
                <span id="current-length">0</span>
            </div>
            <div class="hud-item">
                <span class="label">SCORE</span>
                <span id="total-score">0</span>
            </div>
            <div id="leaderboard">
                <!-- List items injected here -->
            </div>
            <div class="hud-item">
                <span class="label">TIME</span>
                <span id="timer">01:30</span>
            </div>
        </div>

        <!-- Canvas -->
        <canvas id="game-canvas"></canvas>

        <!-- HUD Bottom -->
        <div id="hud-bottom" class="hidden">
            <div id="respawn-overlay" class="hidden">
                <div class="respawn-timer">REVIVING IN <span id="respawn-sec">3</span>...</div>
            </div>
            <div id="joystick-zone">
                <div id="joystick-base">
                    <div id="joystick-handle"></div>
                </div>
            </div>
        </div>

        <!-- Game Over / Settlement -->
        <div id="game-over" class="hidden">
            <div class="content">
                <h1 id="game-over-title">DEFEAT</h1>
                
                <table class="comparison-table">
                    <thead>
                        <tr>
                            <th>STAT</th>
                            <th>YOU</th>
                            <th>BOT</th>
                        </tr>
                    </thead>
                    <tbody id="settlement-stats">
                        <!-- Stats rows injected here -->
                    </tbody>
                </table>

                <div class="game-over-btns">
                    <button id="btn-restart">RETRY</button>
                    <button id="btn-exit">EXIT</button>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="src/main.js"></script>
</body>
</html>
